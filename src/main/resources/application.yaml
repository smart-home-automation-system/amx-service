spring:
  application:
    name: amx-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    virtual-host: "/temperature"
    username: "${rabbitmq.username:guest}"
    password: "${rabbitmq.password:guest}"
    connection-timeout: 10s
    requested-heartbeat: 30s
    template:
      # defaults to false; without it the trace breaks at the queue between amx-service
      # and its consumer (heating-service)
      observation-enabled: true
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 5

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

internal:
  service:
    database:
      host: database-service
      port: 6200

# the TCP server of the AMX master that writes Eaton frames to the serial gateways. The host has
# no default here on purpose: it comes from the manifest (AMX_FRAME_SERVER_HOST), and a pod
# without it must not start
amx:
  frame-server:
    port: 20010
    connect-timeout: 2s
    response-timeout: 3s

# the events of the Eaton actuators (HAS-229), published over a second connection to the same
# broker as spring.rabbitmq.*: the virtual host of the devices, where the Shelly devices publish
# over MQTT, and its topic exchange, bound with "#" to every device.<env>.<domain> queue. The
# password has no default on purpose: it comes from the manifest (DEVICE_EVENTS_PASSWORD), and a
# pod without it must not start
device-events:
  virtual-host: /device
  username: device
  exchange: amq.topic
  confirm-timeout: 5s

# the notifications of the watch of the frame server (HAS-309), published over a third connection
# to the same broker: the headers exchange of /notification routes by category and env. The
# password has no default on purpose: with one the pod would start and fail every publish.
# Without the variable the service does not start (cholewa.required-properties)
notification:
  virtual-host: /notification
  username: notification
  password: ${notification-rabbitmq-password}
  exchange: notification
  env: prod

cholewa:
  required-properties:
    - property: notification.password
      variable: notification-rabbitmq-password

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
    org.springframework.amqp: INFO
    org.springframework.amqp.rabbit.connection: DEBUG

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

server:
  port: 6001
management:
  server:
    port: 8001

internal:
  service:
    database:
      host: localhost
      port: 6005

# nothing listens there unless a stub is started: a local run cannot move a blind by accident
amx:
  frame-server:
    host: localhost

# a local run starts without the variable; with it, its alerts go to the dev queues
notification:
  password: ${notification-rabbitmq-password:dummyPassword}
  env: dev

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test

# a port nothing listens on: a context of a test never reaches the AMX master
amx:
  frame-server:
    host: localhost
    port: 1

# nothing connects in a test: the connection is opened by the first publish
device-events:
  password: test

# env test: no binding of the exchange matches it
notification:
  password: test
  env: test

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
