spring:
  application:
    name: amx-service
    version: @project.version@
  profiles:
    active: home
  webflux:
    base-path: "/home"
  reactor:
    # default LIMITED restores ThreadLocals only in "tap" and "handle", so traceId would be
    # missing from the MDC of every log statement inside a reactive chain
    context-propagation: auto
  rabbitmq:
    host: rabbitmq-headless
    port: 5672
    virtual-host: "/temperature"
    username: "${rabbitmq.username:guest}"
    password: "${rabbitmq.password:guest}"
    connection-timeout: 10s
    requested-heartbeat: 30s
    template:
      # defaults to false; without it the trace breaks at the queue between amx-service
      # and its consumers (heating-service, notification-service)
      observation-enabled: true
      retry:
        enabled: true
        initial-interval: 1000ms
        multiplier: 5

server:
  port: 6200
management:
  server:
    port: 8200
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  tracing:
    sampling:
      # default 0.1; a home system generates so little traffic that sampling everything is free,
      # and a partially sampled trace is useless when it is the only record of a request
      probability: 1.0

internal:
  service:
    database:
      host: database-service
      port: 6200

logbook:
  format:
    style: json

logging:
  structured:
    format:
      console: logstash
  level:
    org.zalando.logbook: trace
    org.springframework.amqp: INFO
    org.springframework.amqp.rabbit.connection: DEBUG

---

spring:
  config:
    activate:
      on-profile: local
  rabbitmq:
    host: localhost

server:
  port: 6001
management:
  server:
    port: 8001

internal:
  service:
    database:
      host: localhost
      port: 6005

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""

---

spring:
  config:
    activate:
      on-profile: test

logbook:
  format:
    style: http

logging:
  structured:
    format:
      console: ""
